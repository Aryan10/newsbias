[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsbias"
version = "0.1.0"
description = "Reproducible news political-leaning and biased-language experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "filelock>=3.15,<4",
]

[project.optional-dependencies]
transformers = ["torch>=2.5,<3", "transformers>=4.45,<5"]
llm = ["openai>=1.99,<3", "python-dotenv>=1.0,<2"]
web = [
  "fastapi>=0.110", "uvicorn>=0.30", "jinja2>=3.1", "pyyaml>=6,<7",
  "beautifulsoup4>=4.12,<5", "urllib3>=2,<3", "python-multipart>=0.0.20,<1",
  "trafilatura>=2.3,<3", "newspaper4k>=0.9.6,<1",
  "lingua-language-detector>=2.1,<3",
]

[project.scripts]
newsbias = "newsbias.cli:main"
newsbias-benchmark = "newsbias.benchmark_cli:main"
newsbias-remote = "newsbias.remote.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: mark test as integration test requiring external live API credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
