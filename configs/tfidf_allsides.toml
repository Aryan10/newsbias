[dataset]
adapter = "newsbias.datasets.all_sides:AllSidesDataset"

[dataset.parameters]
name = "upasanachatterjee/AllSides-random-split"
revision = "4d33d17c5591ad5d4e37ffd6238d7ead8590a70e"
text_column = "content"
processed_cache_dir = "data/processed"
download_cache_dir = "data/cache"
split_seed = 42
train_fraction = 0.7
validation_fraction = 0.1
test_fraction = 0.2

[model]
adapter = "newsbias.models.tfidf:TfidfModel"

[model.parameters]
max_features = 100000
ngram_max = 2
min_df = 2
c = 1.0
max_iter = 1000
seed = 42

[training]
enabled = true
save_model = true

[evaluation]
splits = ["validation"]
batch_size = 128
